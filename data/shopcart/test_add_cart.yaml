-
  feature: 购物车模块
  story: 加入购物车接口
  title: 商品正常加购成功
  request:
    methods: post
    url: http://134.175.134.64:8080/api/cart/items
    headers: 
      Authorization: "Bearer ${token}"
    json:
      "productId": 1
      "quantity": 2
  validate: 
    - eq: ["status_code", 201]

-
  feature: 购物车模块
  story: 加入购物车接口
  title: 商品不存在
  request:
    methods: post
    url: http://134.175.134.64:8080/api/cart/items
    headers: 
      Authorization: "Bearer ${token}"
    json:
      "productId": 10
      "quantity": 2
  validate: 
    - eq: ["status_code", 404]
    - eq: ["json.error.code", "NOT_FOUND"]
    - eq: ["json.error.message", "商品不存在"]

-
  feature: 购物车模块
  story: 加入购物车接口
  title: 商品库存不足
  request:
    methods: post
    url: http://134.175.134.64:8080/api/cart/items
    headers: 
      Authorization: "Bearer ${token}"
    json:
      "productId": 1
      "quantity": 99
  validate: 
    - eq: ["status_code", 409]
    - eq: ["json.error.code", "OUT_OF_STOCK"]
    - eq: ["json.error.message", "库存不足或购买数量过多"]

-
  feature: 购物车模块
  story: 加入购物车接口
  title: 数量超出上限
  request:
    methods: post
    url: http://134.175.134.64:8080/api/cart/items
    headers: 
      Authorization: "Bearer ${token}"
    json:
      "productId": 1
      "quantity": 100
  validate: 
    - eq: ["status_code", 400]
    - eq: ["json.error.code", "INVALID_QUANTITY"]
    - eq: ["json.error.message", "数量应为 1 至 99 的整数"]

-
  feature: 购物车模块
  story: 加入购物车接口
  title: 用户未登录
  request:
    methods: post
    url: http://134.175.134.64:8080/api/cart/items
    headers: null
    json:
      "productId": 1
      "quantity": 2
  validate: 
    - eq: ["status_code", 401]
    - eq: ["json.error.code", "UNAUTHORIZED"]
    - eq: ["json.error.message", "请先登录"]
