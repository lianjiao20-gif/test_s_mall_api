-
  feature: 购物车模块
  story: 修改购物车商品接口
  title: 修改商品后的数量
  request:
    methods: patch
    url: http://134.175.134.64:8080/api/cart/items/{productId}
    headers: 
      Authorization: "Bearer ${token}"
    path_params:
      productId: 2
    json:
      quantity: 1
  validate: 
    - eq: ["status_code", 200]

