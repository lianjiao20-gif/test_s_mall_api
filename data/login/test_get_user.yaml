-
  feature: 登录模块
  story: 获取用户信息接口
  title: 用户登录成功
  request:
    methods: get
    url: http://134.175.134.64:8080/api/auth/me
    headers: 
      Authorization: "Bearer ${token}"
  validate: 
    - eq: ["status_code", 200]
    - eq: ["json.user.id", 1]
    - eq: ["json.user.email", "${SMALL_U1_EMAIL}"]
    - eq: ["json.user.name", "演示用户"]

-
  feature: 登录模块
  story: 获取用户信息接口
  title: 用户未登录
  request:
    methods: get
    url: http://134.175.134.64:8080/api/auth/me
    headers: null
  validate: 
    - eq: ["status_code", 401]
    - eq: ["json.error.code", "UNAUTHORIZED"]
    - contains: ["json.error.message", "请先登录"]