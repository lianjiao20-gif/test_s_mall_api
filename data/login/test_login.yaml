-
  feature: 登录模块
  story: 登录模块接口
  title: 登录参数为空
  request:
    methods: post
    url: http://134.175.134.64:8080/api/auth/login
    headers: null
    params:
      "email": ""
      "password": ""
  validate: 
    - eq: ["status_code", 400]
    - eq: ["json.error.code", "INVALID_INPUT"]
    - contains: ["json.error.message", "请输入邮箱和密码"]