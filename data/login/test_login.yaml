-
  feature: 登录模块
  story: 登录模块接口
  title: 登录成功
  request:
    methods: post
    url: http://134.175.134.64:8080/api/auth/login
    headers: null
    params:
      "email": ${SMALL_U1_EMAIL}
      "password": ${SMALL_U1_PASSWORD}
  validate:
    - eq: ["status_code", 200]
    - contains: ["json.token", "eyJh"]
    - ne: ["json.token", ""]
    - eq: ["json.user.id", 1]
    - eq: ["json.user.email", "${SMALL_U1_EMAIL}"]
    - eq: ["json.user.name", "演示用户"]
  extract:
    - token: json.token

