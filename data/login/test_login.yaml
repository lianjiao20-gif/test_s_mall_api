-
  feature: 登录模块
  story: 登录模块接口
  title: email参数有误
  request:
    methods: post
    url: http://134.175.134.64:8080/api/auth/login
    headers: null
    params:
      "email": "123"
      "password": ${SMALL_U1_PASSWORD}
  validate:
    - eq: ["status_code", 401]
    - eq: ["json.error.code", "INVALID_CREDENTIALS"]
    - contains: ["json.error.message", "邮箱或密码错误"]

