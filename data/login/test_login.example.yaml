# Copy this file to test_login.yaml and fill in a dedicated test account.
- feature: 登录模块
  story: 登录模块接口
  title: 登录成功
  request:
    methods: post
    url: https://your-test-api.example/api/auth/login
    headers: null
    params:
      email: your-test-account@example.com
      password: replace-with-local-password
  validate:
    - eq: ["status_code", 200]
    - ne: ["json.token", ""]
  extract:
    - token: json.token
